name: Publish release metadata

on:
  release:
    types: [published]

concurrency:
  group: publish-release-metadata
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.release.draft == false && github.event.release.prerelease == false }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build tagged release
        env:
          SYSTEMSCULPT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          revision="$(git rev-parse HEAD)"
          node scripts/release-plugin.mjs \
            --expected-revision="${revision}" \
            --expected-tag="${SYSTEMSCULPT_RELEASE_TAG}"

      - name: Compare published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEMSCULPT_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          published_dir="${RUNNER_TEMP}/published-release"
          mkdir -p "${published_dir}"
          gh release download "${SYSTEMSCULPT_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${published_dir}" \
            --pattern manifest.json \
            --pattern main.js \
            --pattern styles.css
          for artifact in manifest.json main.js styles.css; do
            if ! cmp --silent "${artifact}" "${published_dir}/${artifact}"; then
              echo "Published ${artifact} does not match the tagged production build byte-for-byte." >&2
              sha256sum "${artifact}" "${published_dir}/${artifact}" >&2
              exit 1
            fi
          done

      - name: Attest exact published assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/published-release/manifest.json
            ${{ runner.temp }}/published-release/main.js
            ${{ runner.temp }}/published-release/styles.css

  publish:
    if: ${{ github.event.release.draft == false && github.event.release.prerelease == false }}
    needs: verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-release-metadata
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"

      - name: Validate release identity
        env:
          SYSTEMSCULPT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SYSTEMSCULPT_RELEASE_URL: ${{ github.event.release.html_url }}
          SYSTEMSCULPT_RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: node scripts/plugin-release-metadata.mjs --check

      - name: Publish release metadata
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_METADATA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_METADATA_R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET_NAME: ${{ vars.RELEASE_METADATA_R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ vars.RELEASE_METADATA_R2_ENDPOINT }}
          SYSTEMSCULPT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SYSTEMSCULPT_RELEASE_URL: ${{ github.event.release.html_url }}
          SYSTEMSCULPT_RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          current_metadata="${RUNNER_TEMP}/current-plugin-release.json"
          current_count="$(aws s3api list-objects-v2 \
            --bucket "${R2_BUCKET_NAME}" \
            --prefix "plugin/releases/latest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --query "length(Contents[?Key=='plugin/releases/latest.json'])" \
            --output text)"
          if [ "${current_count}" = "1" ]; then
            aws s3 cp "s3://${R2_BUCKET_NAME}/plugin/releases/latest.json" "${current_metadata}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --only-show-errors
            node scripts/plugin-release-metadata.mjs --assert-not-older="${current_metadata}"
          elif [ "${current_count}" != "0" ]; then
            echo "Unexpected release metadata object count: ${current_count}" >&2
            exit 1
          fi
          node scripts/plugin-release-metadata.mjs | aws s3 cp - "s3://${R2_BUCKET_NAME}/plugin/releases/latest.json" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-store" \
            --only-show-errors

      - name: Verify SystemSculpt release endpoint
        env:
          SYSTEMSCULPT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SYSTEMSCULPT_RELEASE_URL: ${{ github.event.release.html_url }}
          SYSTEMSCULPT_RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: node scripts/plugin-release-metadata.mjs --verify-url=https://systemsculpt.com/api/plugin/releases/latest
