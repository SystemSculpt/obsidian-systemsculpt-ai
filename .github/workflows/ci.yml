name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SYSTEMSCULPT_TEST_EVIDENCE_DIR: .cache/ci-evidence/jest-seeds

jobs:
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # One build feeds the full source, mobile-policy, unit, embeddings,
      # compiled-artifact integration, and release-script contract.
      - id: run_check_ci
        timeout-minutes: 13
        run: npm run check:ci
      - name: Verify structured failure evidence
        if: ${{ failure() && steps.run_check_ci.conclusion == 'failure' }}
        run: node scripts/verify-ci-failure-evidence.mjs --job plugin
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-ci-failure-evidence-ubuntu-node-22
          path: |
            .cache/ci-evidence
            .cache/coverage-chatview-critical-risk/coverage-summary.json
            manifest.json
            main.js
            styles.css
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "20.10.0"
          - os: ubuntu-latest
            node: "24.x"
          - os: macos-latest
            node: "22.x"
          - os: windows-latest
            node: "22.x"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: run_check_compat
        timeout-minutes: 18
        run: npm run check:compat
      - name: Verify structured failure evidence
        if: ${{ failure() && steps.run_check_compat.conclusion == 'failure' }}
        run: node scripts/verify-ci-failure-evidence.mjs --job compatibility
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-compat-failure-evidence-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            .cache/ci-evidence
            .cache/coverage-chatview-critical-risk/coverage-summary.json
            manifest.json
            main.js
            styles.css
          if-no-files-found: warn
          retention-days: 14

  required:
    if: ${{ always() }}
    needs:
      - plugin
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI lane
        env:
          PLUGIN_RESULT: ${{ needs.plugin.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: |
          printf '[required] plugin=%s compatibility=%s\n' "${PLUGIN_RESULT}" "${COMPATIBILITY_RESULT}"
          for lane in plugin compatibility; do
            case "$lane" in
              plugin) result="${PLUGIN_RESULT}" ;;
              compatibility) result="${COMPATIBILITY_RESULT}" ;;
            esac
            case "${result}" in
              success) ;;
              failure|cancelled|skipped)
                echo "[required] ${lane} did not succeed: ${result}" >&2
                exit 1
                ;;
              *)
                echo "[required] ${lane} returned an unexpected result: ${result}" >&2
                exit 1
                ;;
            esac
          done
